  nav.tabs button.active{color:#fff;border-bottom-color:var(--teal-500);}

  .panel-head p{margin:2px 0 0;color:var(--ink-600);font-size:13px;}

  .grid{display:grid;gap:14px;}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;}
  .kpi .num{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;}
  .kpi .lbl{font-size:12px;color:var(--ink-600);margin-top:2px;}
  .kpi.accent{border-left:3px solid var(--teal-600);}

  .card > .card-head .count{font-size:12px;color:var(--ink-600);}
  .card-body{padding:14px 16px;}

  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th{text-align:left;color:var(--ink-600);font-weight:600;font-size:11.5px;text-transform:none;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}

  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#F8FAFB;}

     scroll on a laptop screen. */

  .compact-table td{padding:4px 6px;font-size:11.5px;}
  .compact-table td:first-child{white-space:nowrap;}
  .mono{font-family:var(--mono);font-size:11.8px;color:var(--ink-600);}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums;}

  .badge.st-not{background:var(--grey-bg);color:var(--grey);}

  .session-bar{display:flex;align-items:center;justify-content:space-between;background:#EDF6F6;border:1px solid #CFE7E8;border-radius:6px;padding:8px 14px;margin-bottom:16px;font-size:12.5px;}
  .session-bar a{cursor:pointer;color:var(--teal-600);font-weight:600;text-decoration:none;}
  .kpi-status{grid-template-columns:repeat(3,1fr);}

   No fake demo rows — the dashboard starts empty and is populated

   ========================================================= */
function makeSeedTransactions(){
  return [];
}

function baseTxn(t){
  const submitted = t.status !== 'Not Submitted';
  return {
    id: t.id,
    category: t.category,            // 'over30' | 'refund' | 'fullprice'
    storeCode: t.storeCode,
    transactionNumber: t.transactionNumber,  // the report's distinct Transaction key
    itemCount: t.itemCount,          // number of line items under this transaction
    qty: t.qty,                      // summed Return Qty
    amount: t.amount,                // summed Return Total Amount
    paymentMethod: t.paymentMethod || '',
    date: t.date,                    // Return Date, yyyy-mm-dd
    time: t.time || '',              // Transaction Time, HH:MM (from report column AB)
    agingDays: t.agingDays ?? null,  // Return Date - Original Date, only set when known
    priceType: t.priceType || 'N/A', // 'Full Price' | 'Discounted' | 'Mixed' | 'N/A'
    discountValue: t.discountValue || 0, // sum of (full-price value - actual) across discounted line items
    barcodes: t.barcodes || [],      // [{barcode, qty, amount, fullPrice}] — line-level detail under this transaction
    origTransaction: t.origTransaction || '', // Original (sale) transaction number from the report
    storeApproval: submitted ? true : false,
    storeRemarks: submitted ? t.storeRemarks || '' : '',
    // Reason for Return — required before submission, alongside store
    // remarks. If reason==='Other', reasonRemarks holds the free-text note.
    reason: t.reason || '',
    reasonRemarks: t.reasonRemarks || '',
    clusterRemarks: t.clusterRemarks || '',
    // reviewHistory: one entry per Cluster Manager decision round.
    // reviewHistory[0] = "Cluster Review" (first decision: Signed Off or Re-Review).
    // reviewHistory[1] = "Cluster Manager Review 2" (only exists if round 1 was
    // Re-Review and the store resubmitted with justification — this is the
    // Cluster Manager's second look). {round, decision, remarks, by, date}
    reviewHistory: t.reviewHistory || [],
    status: t.status,
    submittedDate: submitted ? t.date : null,
    reviewedDate: (t.status==='Signed Off'||t.status==='Re-Review') ? t.date : null,
    lastUpdated: new Date().toISOString(),
    lastUpdatedBy: submitted ? 'Store Manager' : null,
  };
}

/* =========================================================
   STORAGE — Google Apps Script Web App is now the source of
   truth (Google Sheet "DataStore" tab). See Code.gs.
   ========================================================= */
async function fetchDataFromBackend(){
  try{
    // cache:'no-store' + a timestamp query param stop the browser from
    // silently replaying a cached response on refresh instead of actually
    // asking Apps Script again.
    const res = await fetch(APPS_SCRIPT_URL + '?action=load&_=' + Date.now(), { cache:'no-store' });
    const json = await res.json();
    if(json && json.ok) return json.data;
    showToast('Backend returned an error loading data.', 5000);
  }catch(e){
    showToast('Could not reach the backend — check APPS_SCRIPT_URL. ('+(e.message||e)+')', 6000);
  }
  return null;
}
async function loadData(){
  const data = await fetchDataFromBackend();
  if(data) return data;
  // Empty-seed fallback is only appropriate on the very first load, when
  // there's no existing dashboard state to protect. See the auto-refresh
  // handler below for why a failed refresh must NOT reach this path.
  return { transactions: makeSeedTransactions(), auditLog: [
    {timestamp:new Date().toISOString(), user:'System', role:'System', action:'Backend unreachable — showing empty local state', transaction:'—', prevStatus:'—', newStatus:'—', remarks:''}
  ], uploadLog: [], lastUploadTs: null };
}
async function saveData(data){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // plain text avoids a CORS preflight Apps Script can't answer
      body: JSON.stringify({ action:'save', secret: SHARED_SECRET, data })
    });
    const json = await res.json();
    if(!json || !json.ok){
      // The request reached Apps Script but was rejected (e.g. SHARED_SECRET
      // mismatch) — this used to fail silently, leaving the change only in
      // this browser's memory until the next refresh wiped it out. Now it's
      // surfaced loudly instead, because a compliance tool silently losing
      // submitted data is worse than an ugly error message.
      showToast('SAVE REJECTED BY BACKEND — this change was NOT written to the Sheet and will be lost on refresh. ('+(json&&json.error?json.error:'unknown error')+')', 8000);
      return false;
    }
    return true;
  }catch(e){
    showToast('Save failed — changes may not persist. ('+(e.message||e)+')', 8000);
    return false;
  }
}
// Server-side credential check. role: 'store' | 'cluster' | 'regional' | 'admin'.
// identifier: store code / cluster manager name / region name / admin username.
async function verifyLogin(role, identifier, password){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'login', secret: SHARED_SECRET, role, identifier, password })
    });
    const json = await res.json();
    return !!(json && json.ok);
  }catch(e){
    showToast('Could not reach the backend to verify login. ('+(e.message||e)+')', 6000);
    return false;
  }
}
function addAudit(entry){
  DATA.auditLog.unshift(Object.assign({timestamp:new Date().toISOString()}, entry));
  if(DATA.auditLog.length>500) DATA.auditLog.length = 500;
}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ return 'Rs ' + Number(n||0).toLocaleString('en-PK',{maximumFractionDigits:0}); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(iso){ const dt=new Date(iso); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' '+dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function fmtBarcodes(list){
  if(!list || !list.length) return '—';
  const shown = list.slice(0,3).map(b=>esc(b.barcode)+(b.qty>1?` (x${b.qty})`:''));
  const extra = list.length>3 ? ` <span class="mono">+${list.length-3} more</span>` : '';
  return `<span class="mono">${shown.join(', ')}</span>${extra}`;
}
function badge(status){
  const map={'Not Submitted':'st-not','Awaiting Review':'st-await','Re-Review':'st-rereview','Signed Off':'st-signed'};
  return `<span class="badge ${map[status]||'st-not'}">${esc(status)}</span>`;
}
function txnsFor(filterFn){ return DATA.transactions.filter(filterFn); }
function showToast(msg, ms=3200){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.remove('hide');
  clearTimeout(showToast._h);
  showToast._h=setTimeout(()=>t.classList.add('hide'), ms);
}

/* =========================================================
   RENDER: SHELL
   ========================================================= */
const NAV_ITEMS = [
  ['hq','HQ Dashboard'],
  ['store','Store Entry'],
  ['cluster','Cluster Review'],
  ['regional','Regional Manager Insights'],
];

function renderShell(){
  const tabBar = document.getElementById('tabBar');
  tabBar.innerHTML = NAV_ITEMS.map(([id,label])=>`<button data-nav="${id}" class="${screen===id?'active':''}">${esc(label)}</button>`).join('');
  tabBar.querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ screen=b.dataset.nav; render(); };
  });
  renderClock();
}

function renderClock(){
  const box = document.getElementById('clockBox');
  const ts = lastLoadedTs ? fmtDateTime(lastLoadedTs).split(' ').pop() + ', ' + fmtDateTime(lastLoadedTs) : '—';
  const mm = String(Math.floor(nextRefreshIn/60)).padStart(2,'0');
  const ss = String(nextRefreshIn%60).padStart(2,'0');
  box.innerHTML = `Last updated: <b>${lastLoadedTs? fmtDateTime(lastLoadedTs):'—'}</b> · Next refresh in <b>${mm}:${ss}</b>`;
}

/* =========================================================
   RENDER: MAIN ROUTER
   ========================================================= */
function render(){
  renderShell();
  const main = document.getElementById('mainArea');
  // Admin, once logged in, can open any Store / Cluster / Regional tab
  // without a second password — that's the whole point of being Admin.
  // A default selection is picked automatically the first time so the
  // view has something to show; each view exposes its own selector (see
  // renderStoreView / renderClusterView) so Admin can switch between
  // stores/managers/regions without ever hitting a login gate.
  if(adminAuth.unlocked){
    if(!storeAuth.storeCode) storeAuth.storeCode = STORES.filter(s=>!s.closed)[0].code;
    storeAuth.unlocked = true;
    if(!clusterAuth.clusterManager) clusterAuth.clusterManager = CLUSTER_MANAGERS[0];
    clusterAuth.unlocked = true;
    regionalAuth.unlocked = true;
  }
  if(screen==='store') main.innerHTML = storeAuth.unlocked ? renderStoreView() : renderStoreLogin();
  else if(screen==='cluster') main.innerHTML = clusterAuth.unlocked ? renderClusterView() : renderClusterLogin();
  else if(screen==='regional') main.innerHTML = regionalAuth.unlocked ? renderRegionalView() : renderRegionalLogin();
  else if(screen==='hq') main.innerHTML = renderHQView();
  else if(screen==='admin') main.innerHTML = adminAuth.unlocked ? renderAdminView() : renderAdminLogin();
  bindDynamicHandlers();
}

// Line-level detail: one row per barcode/line-item, not per transaction.
// Approval / remarks / status / review columns are transaction-level and are
// only shown on the first line of each transaction (idx===0) to avoid
// repeating editable controls, but they carry the same transaction id so a
// multi-line transaction is still approved/remarked as one unit.
function flattenToLines(rows){
  const lines = [];
  rows.forEach(t=>{
    const items = (t.barcodes && t.barcodes.length) ? t.barcodes : [{barcode:'—', qty:t.qty, amount:t.amount, fullPrice:null}];
    items.forEach((b,idx)=> lines.push({t, b, idx}));
  });
  return lines;
}

function renderStoreCategoryTable(cat, rows, store){
  const cols = ['Return Date','Time','Transaction No.','Barcode','Return Qty','Return Amount','Payment Method']
    .concat(cat==='over30' ? ['Aging (days)'] : [])
    .concat(['Price Type','Original Transaction','Is Approved by Manager','Reason for Return','Store Remarks','Status','Cluster Review','Cluster Manager Review 2']);

  const lines = flattenToLines(rows);

  const body = lines.length ? lines.map(({t,b,idx})=>{
    const editable = t.status==='Not Submitted';
    const respondable = t.status==='Re-Review';
    const priceTypeLine = b.fullPrice===true ? 'Full Price' : b.fullPrice===false ? 'Discounted' : t.priceType;
    return `<tr>
      <td>${fmtDate(t.date)}</td>
      <td class="mono">${esc(t.time)||"—"}</td>
      <td class="mono">${esc(t.transactionNumber)}</td>
      <td class="mono">${esc(b.barcode)}</td>
      <td class="num-cell">${b.qty}</td>
      <td class="num-cell">${money(b.amount!=null?b.amount:t.amount)}</td>
      <td>${esc(t.paymentMethod||'—')}</td>
      ${cat==='over30' ? `<td class="num-cell">${t.agingDays==null?'—':t.agingDays}</td>` : ''}
      <td>${esc(priceTypeLine)}</td>
      <td class="mono">${esc(t.origTransaction||'—')}</td>
      <td>${idx!==0 ? '' : (editable ? `<input type="checkbox" data-approve="${t.id}" ${t.storeApproval?'checked':''}>` : (t.storeApproval? '✓':'—'))}</td>
      <td style="min-width:170px;">${idx!==0 ? '' : reasonCell(t, editable)}</td>
      <td style="min-width:200px;">${idx!==0 ? '' : (
        editable
          ? `<textarea data-remark="${t.id}" placeholder="Store remarks...">${esc(t.storeRemarks)}</textarea>`
          : respondable
            ? `<div class="remark-locked" style="margin-bottom:5px;"><b>Cluster Manager:</b> ${esc(t.clusterRemarks)}</div><textarea data-respond="${t.id}" placeholder="Your response...">${esc(t.storeRemarks)}</textarea>`
            : `<div class="remark-locked">${esc(t.storeRemarks)||'—'}</div>`
      )}</td>
      <td>${idx!==0 ? '' : (badge(t.status)+(respondable?`<div style="margin-top:6px;"><button class="btn sm" data-resubmit="${t.id}">Resubmit</button></div>`:''))}</td>
      <td style="min-width:160px;">${idx!==0 ? '' : reviewRoundCell(t,1)}</td>
      <td style="min-width:160px;">${idx!==0 ? '' : reviewRoundCell(t,2)}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="${cols.length}" class="empty">No transactions in this category.</td></tr>`;

  return `
    <div class="card">
      <div class="card-head"><h2>${CATEGORY_LABEL[cat]}</h2><span class="count">${rows.length} transaction(s)</span></div>
      <div class="card-body" style="overflow-x:auto;">
        <table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>
      </div>
    </div>`;
}

// Reason for Return cell: a dropdown when editable, plus a free-text box
// that only appears when "Other" is selected. Locked to plain text once the
// transaction is submitted, same as Store Remarks.
function reasonCell(t, editable){
  if(!editable){
    const label = t.reason==='Other' ? `Other — ${esc(t.reasonRemarks)||'(no remarks)'}` : (t.reason||'—');
    return `<div class="remark-locked">${esc(label)}</div>`;
  }
  return `
    <select data-reason="${t.id}">
      <option value="">Select reason...</option>
      ${REASON_OPTIONS.map(r=>`<option value="${esc(r)}" ${t.reason===r?'selected':''}>${esc(r)}</option>`).join('')}
    </select>
    ${t.reason==='Other' ? `<textarea data-reasonremarks="${t.id}" placeholder="Remarks for Other..." style="margin-top:6px;">${esc(t.reasonRemarks)}</textarea>` : ''}
  `;
}

/* =========================================================
   CLUSTER MANAGER VIEW
   ========================================================= */
function renderClusterView(){
  const mgr = clusterAuth.clusterManager;
  const stores = STORES.filter(s=>s.clusterManager===mgr);
  const codes = stores.map(s=>s.code);
  const all = txnsFor(t=>codes.includes(t.storeCode));
  const f = clusterFilters;
  // Date range applies to the Store Summary counts (historical reporting)
  // only — the Review Queue below always shows every pending item
  // regardless of date, so nothing awaiting action can get hidden by a
  // filter someone forgot was set.
  const summaryScope = all.filter(t=>{
    if(f.dateFrom && t.date<f.dateFrom) return false;
    if(f.dateTo && t.date>f.dateTo) return false;
    return true;
  });

  const summaryRows = stores.map(s=>{
    const ts = summaryScope.filter(t=>t.storeCode===s.code);
    const c = st => ts.filter(t=>t.status===st).length;
    // Per-category performance — distinct transaction count, summed Return
    // Qty, and summed compliance Value — same category stats used in the
    // Cluster/Regional/HQ KPI rows (clusterKpiRow), just scoped to one store.
    const cat = code => { const g = ts.filter(t=>t.category===code); return {count:g.length, qty:g.reduce((s,t)=>s+t.qty,0), amt:g.reduce((s,t)=>s+t.amount,0)}; };
    const refund=cat('refund'), over30=cat('over30'), fullprice=cat('fullprice');
    return `<tr>
      <td>${esc(s.name)}</td>
      <td class="num-cell">${refund.count}</td><td class="num-cell">${refund.qty}</td><td class="num-cell">${money(refund.amt)}</td>
      <td class="num-cell">${over30.count}</td><td class="num-cell">${over30.qty}</td><td class="num-cell">${money(over30.amt)}</td>
      <td class="num-cell">${fullprice.count}</td><td class="num-cell">${fullprice.qty}</td><td class="num-cell">${money(fullprice.amt)}</td>
      <td class="num-cell">${c('Signed Off')}</td>
      <td class="num-cell">${c('Awaiting Review')}</td>
      <td class="num-cell">${c('Re-Review')}</td>
      <td class="num-cell">${c('Not Submitted')}</td>
    </tr>`;
  }).join('');

  const queue = all.filter(t=>t.status==='Awaiting Review').sort((a,b)=>a.date<b.date?1:-1);
  const queueLines = flattenToLines(queue);
  const QUEUE_COLS = 17;

  const queueRows = queueLines.length ? queueLines.map(({t,b,idx})=>{
    const store = storeByCode(t.storeCode);
    const priceTypeLine = b.fullPrice===true ? 'Full Price' : b.fullPrice===false ? 'Discounted' : t.priceType;
    return `<tr>
      <td>${idx!==0?'':esc(store.name)}</td>
      <td>${fmtDate(t.date)}</td>
      <td class="mono">${esc(t.time)||"—"}</td>
      <td class="mono">${esc(t.transactionNumber)}</td>
      <td class="mono">${esc(b.barcode)}</td>
      <td class="num-cell">${b.qty}</td>
      <td class="num-cell">${money(b.amount!=null?b.amount:t.amount)}</td>
      <td>${esc(t.paymentMethod||'—')}</td>
      <td>${esc(priceTypeLine)}</td>
      <td class="mono">${esc(t.origTransaction||'—')}</td>
      <td>${idx!==0?'':esc(t.reason==='Other'?`Other — ${t.reasonRemarks||'(no remarks)'}`:(t.reason||'—'))}</td>
      <td>${idx!==0?'':`<div class="remark-locked">${esc(t.storeRemarks)||'—'}</div>`}</td>
      <td>${idx!==0?'':badge(t.status)}</td>
      <td style="min-width:160px;">${idx!==0?'':reviewRoundCell(t,1)}</td>
      <td style="min-width:160px;">${idx!==0?'':reviewRoundCell(t,2)}</td>
      <td style="min-width:200px;">${idx!==0?'':`<textarea data-clusterremark="${t.id}" placeholder="Cluster Manager remarks...">${esc(t.clusterRemarks)}</textarea>`}</td>
      <td style="white-space:nowrap;">${idx!==0?'':`
        <button class="btn sm" data-signoff="${t.id}">Sign Off</button>
        <button class="btn sm danger" data-rereview="${t.id}">Re-Review</button>
      `}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="${QUEUE_COLS}" class="empty">No transactions awaiting review.</td></tr>`;

  return `
    <div class="session-bar">
      <span>Reviewing as <b>${esc(mgr)}</b></span>
      ${adminAuth.unlocked
        ? `<select id="adminClusterSwitch" style="margin-left:10px;">${CLUSTER_MANAGERS.map(m=>`<option value="${esc(m)}" ${m===mgr?'selected':''}>${esc(m)}</option>`).join('')}</select>`
        : `<a id="clusterLockBtn">Lock / switch manager</a>`
      }
    </div>
    <div class="panel-head">
      <div><h1>Cluster Review — ${esc(mgr)}</h1><p>${stores.map(s=>s.name).join(', ')}</p></div>
    </div>
    <div class="filters-grid" style="max-width:420px;">
      <div><span class="field-label">From date</span><input type="date" id="cFDateFrom" value="${f.dateFrom||''}"></div>
      <div><span class="field-label">To date</span><input type="date" id="cFDateTo" value="${f.dateTo||''}"></div>
      <div style="align-self:end;"><button class="btn sm secondary" id="cFClearBtn">Clear dates</button></div>
    </div>
    <div class="locked-note" style="margin:4px 0 12px;">${(f.dateFrom||f.dateTo) ? `Store Summary below is showing ${f.dateFrom?fmtDate(f.dateFrom):'the beginning'} through ${f.dateTo?fmtDate(f.dateTo):'today'}.` : 'Store Summary below is the full cumulative total across every day currently loaded.'} The Review Queue always shows every pending item regardless of this filter.</div>

        <tbody>${summaryRows}</tbody></table>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h2>Review Queue</h2><span class="count">${queue.length} awaiting</span></div>
      <div class="card-body" style="overflow-x:auto;">
        <table><thead><tr><th>Store</th><th>Return Date</th><th>Time</th><th>Transaction No.</th><th>Barcode</th><th>Return Qty</th><th>Return Amount</th><th>Payment Method</th><th>Price Type</th><th>Original Transaction</th><th>Reason for Return</th><th>Store Remarks</th><th>Status</th><th>Cluster Review</th><th>Cluster Manager Review 2</th><th>Cluster Remarks (this round)</th><th>Action</th></tr></thead>
        <tbody>${queueRows}</tbody></table>
      </div>
    </div>
  `;
}

/* =========================================================
   REGIONAL VIEW
   ========================================================= */
function clusterKpiRow(mgr, stores, txns){
  // Headline number is distinct TRANSACTION COUNT, not item Qty — a
  // transaction can carry several line items, so Qty (10) and Txn Count (7)
  // are genuinely different numbers (matches the skill's own "Txn Count" vs
  // "Qty" distinction). Showing Qty as the big number was being read as
  // transaction count and looked wrong against the skill's workbook.
  const c = cat => { const ts = txns.filter(t=>t.category===cat); return {count:ts.length, qty:ts.reduce((s,t)=>s+t.qty,0), amt:ts.reduce((s,t)=>s+t.amount,0)}; };
  const refund=c('refund'), over30=c('over30'), fullprice=c('fullprice');
  const bucket = b => txns.filter(t=>statusBucket(t.status)===b).length;
  return `<tr>
    <td>${esc(mgr)}</td>
    <td class="num-cell">${stores.length}</td>
    <td class="num-cell">${refund.count}</td><td class="num-cell">${money(refund.amt)}</td>
    <td class="num-cell">${over30.count}</td><td class="num-cell">${money(over30.amt)}</td>
    <td class="num-cell">${fullprice.count}</td><td class="num-cell">${money(fullprice.amt)}</td>
    <td class="num-cell">${bucket('Signed Off')}</td>
    <td class="num-cell">${bucket('Not Started')}</td>
    <td class="num-cell">${bucket('Open Items')}</td>
  </tr>`;
}

function renderRegionalView(){

  const mgrs = [...new Set(stores.map(s=>s.clusterManager))].filter(m=>m!=='Unassigned');

function renderHQView(){
  const f = getHqFilters();
  const filtered = DATA.transactions.filter(t=>{
    const store = storeByCode(t.storeCode);
    if(f.region!=='all' && store.region!==f.region) return false;
    if(f.dateFrom && t.date<f.dateFrom) return false;
    if(f.dateTo && t.date>f.dateTo) return false;
    return true;
  });

  const bucket = b => filtered.filter(t=>statusBucket(t.status)===b).length;
  const catKpi = cat=>{
    const ts = filtered.filter(t=>t.category===cat);
    return {count:ts.length, qty:ts.reduce((s,t)=>s+t.qty,0), amt:ts.reduce((s,t)=>s+t.amount,0)};
  };
  const refund=catKpi('refund'), over30=catKpi('over30'), fullprice=catKpi('fullprice');

  const regionsInScope = f.region==='all' ? REGIONS : [f.region];

  // is excluded from the summary — it would otherwise show as a phantom row.

  return `

    <div class="grid kpi-status">
      <div class="kpi"><div class="num">${bucket('Signed Off')}</div><div class="lbl">Signed Off</div></div>
      <div class="kpi"><div class="num">${bucket('Not Started')}</div><div class="lbl">Not Started</div></div>
      <div class="kpi"><div class="num">${bucket('Open Items')}</div><div class="lbl">Open Items (Awaiting Review + Re-Review)</div></div>
    </div>
    <div class="grid kpis" style="grid-template-columns:repeat(3,1fr);">
      <div class="kpi accent"><div class="num">${refund.count}</div><div class="lbl">Refund Transactions · Qty ${refund.qty} · ${money(refund.amt)}</div></div>
      <div class="kpi accent"><div class="num">${over30.count}</div><div class="lbl">Return &gt;30 Days Transactions · Qty ${over30.qty} · ${money(over30.amt)}</div></div>
      <div class="kpi accent"><div class="num">${fullprice.count}</div><div class="lbl">Full Price Sale Return Transactions · Qty (distinct) ${fullprice.count} · ${money(fullprice.amt)}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Cluster Manager-wise Summary</h2></div>
      <div class="card-body" style="overflow-x:auto;">

/* =========================================================
   EVENT HANDLERS
   ========================================================= */
function bindDynamicHandlers(){
  // Store: approval checkbox — updates the submit button's enabled state
  // live, WITHOUT a full re-render, so any remarks being typed in other
  // rows are never wiped out by the checkbox click.
  document.querySelectorAll('[data-approve]').forEach(el=>{
    el.onchange = ()=>{
      const t = DATA.transactions.find(x=>x.id===el.dataset.approve);
      t.storeApproval = el.checked;
      persistQuiet();
      updateSubmitButtonState();
    };
  });
  // Store: remarks (draft) / respond (re-review). Saved to the in-memory
  // model on every keystroke (not just on blur) so remarks are never lost
  // to a stray re-render or an auto-refresh landing mid-edit; written to
  // persistent storage on blur to avoid excessive writes.
  document.querySelectorAll('[data-remark], [data-respond]').forEach(el=>{
    el.addEventListener('focus', ()=>editingActive=true);
    el.addEventListener('input', ()=>{
      const id = el.dataset.remark || el.dataset.respond;
      const t = DATA.transactions.find(x=>x.id===id);
      if(t) t.storeRemarks = el.value;
    });
    el.addEventListener('blur', ()=>{
      editingActive=false;
      const id = el.dataset.remark || el.dataset.respond;
      const t = DATA.transactions.find(x=>x.id===id);
      t.storeRemarks = el.value;
      persistQuiet();
    });
  });
  // Reason for Return dropdown + its "Other" free-text follow-up.
  document.querySelectorAll('[data-reason]').forEach(el=>{
    el.onchange = ()=>{
      const t = DATA.transactions.find(x=>x.id===el.dataset.reason);
      if(t) t.reason = el.value;
      persistQuiet();
      render(); // re-render so the "Other" textarea appears/disappears immediately
    };
  });
  document.querySelectorAll('[data-reasonremarks]').forEach(el=>{
    el.addEventListener('focus', ()=>editingActive=true);
    el.addEventListener('input', ()=>{
      const t = DATA.transactions.find(x=>x.id===el.dataset.reasonremarks);
      if(t) t.reasonRemarks = el.value;
    });
    el.addEventListener('blur', ()=>{
      editingActive=false;
      const t = DATA.transactions.find(x=>x.id===el.dataset.reasonremarks);
      if(t) t.reasonRemarks = el.value;
      persistQuiet();
    });
  });
  document.querySelectorAll('[data-clusterremark]').forEach(el=>{
    el.addEventListener('focus', ()=>editingActive=true);
    el.addEventListener('blur', ()=>{
      editingActive=false;
      const t = DATA.transactions.find(x=>x.id===el.dataset.clusterremark);
      t.clusterRemarks = el.value;
      persistQuiet();
    });
  });

  // Submit all approved drafts
  const submitAllBtn = document.getElementById('submitAllBtn');
  if(submitAllBtn) submitAllBtn.onclick = ()=>{
    if(submitAllBtn.disabled) return;
    submitStoreDrafts(storeAuth.storeCode);
  };

  // Resubmit after re-review
  document.querySelectorAll('[data-resubmit]').forEach(b=>{
    b.onclick = ()=>resubmitTxn(b.dataset.resubmit);
  });

  // Cluster manager actions
  document.querySelectorAll('[data-signoff]').forEach(b=>{
    b.onclick = ()=>signOffTxn(b.dataset.signoff);
  });
  document.querySelectorAll('[data-rereview]').forEach(b=>{
    b.onclick = ()=>sendReReview(b.dataset.rereview);
  });

  // HQ filters
  ['fDateFrom','fDateTo','fRegion'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.onchange = ()=>{
      hqFilters = {
        dateFrom: document.getElementById('fDateFrom').value,
        dateTo: document.getElementById('fDateTo').value,
        region: document.getElementById('fRegion').value
      };
      render();
    };
  });
  const fClearBtn = document.getElementById('fClearBtn');
  if(fClearBtn) fClearBtn.onclick = ()=>{
    hqFilters = { dateFrom:'', dateTo:'', region: hqFilters.region };
    render();
  };

  // Cluster Review filters
  ['cFDateFrom','cFDateTo'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.onchange = ()=>{
      clusterFilters = {
        dateFrom: document.getElementById('cFDateFrom').value,
        dateTo: document.getElementById('cFDateTo').value
      };
      render();
    };
  });
  const cFClearBtn = document.getElementById('cFClearBtn');
  if(cFClearBtn) cFClearBtn.onclick = ()=>{ clusterFilters = {dateFrom:'', dateTo:''}; render(); };

  // Regional Manager Insights filters
  ['rFDateFrom','rFDateTo'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.onchange = ()=>{
      regionalFilters = {
        dateFrom: document.getElementById('rFDateFrom').value,
        dateTo: document.getElementById('rFDateTo').value
      };
      render();
    };
  });
  const rFClearBtn = document.getElementById('rFClearBtn');
  if(rFClearBtn) rFClearBtn.onclick = ()=>{ regionalFilters = {dateFrom:'', dateTo:''}; render(); };

  // Regional Manager Insights — region selector
  const regionSel = document.getElementById('regionSelect');
  if(regionSel) regionSel.onchange = (e)=>{ ctx.region = e.target.value; render(); };

  // Store login gate
  const loginStoreSelect = document.getElementById('loginStoreSelect');
  if(loginStoreSelect) loginStoreSelect.onchange = (e)=>{ storeAuth.storeCode = e.target.value; render(); };
  const storeUnlockBtn = document.getElementById('storeUnlockBtn');
  if(storeUnlockBtn) storeUnlockBtn.onclick = async ()=>{
    const sel = document.getElementById('loginStoreSelect');
    const pass = document.getElementById('loginStorePass').value;
    storeUnlockBtn.disabled = true; storeUnlockBtn.textContent = 'Checking...';
    const ok = await verifyLogin('store', sel.value, pass);
    storeUnlockBtn.disabled = false; storeUnlockBtn.textContent = 'Unlock';
    if(ok){
      storeAuth.storeCode = sel.value;
      storeAuth.unlocked = true;
      render();
    } else {
      showToast('Incorrect store password.');
    }
  };
  const storeLockBtn = document.getElementById('storeLockBtn');
  if(storeLockBtn) storeLockBtn.onclick = ()=>{ storeAuth.unlocked = false; render(); };
  const adminStoreSwitch = document.getElementById('adminStoreSwitch');
  if(adminStoreSwitch) adminStoreSwitch.onchange = ()=>{ storeAuth.storeCode = adminStoreSwitch.value; render(); };

  // Cluster login gate
  const loginClusterSelect = document.getElementById('loginClusterSelect');
  if(loginClusterSelect) loginClusterSelect.onchange = (e)=>{ clusterAuth.clusterManager = e.target.value; render(); };
  const clusterUnlockBtn = document.getElementById('clusterUnlockBtn');
  if(clusterUnlockBtn) clusterUnlockBtn.onclick = async ()=>{
    const sel = document.getElementById('loginClusterSelect');
    const pass = document.getElementById('loginClusterPass').value;
    clusterUnlockBtn.disabled = true; clusterUnlockBtn.textContent = 'Checking...';
    const ok = await verifyLogin('cluster', sel.value, pass);
    clusterUnlockBtn.disabled = false; clusterUnlockBtn.textContent = 'Unlock';
    if(ok){
      clusterAuth.clusterManager = sel.value;
      clusterAuth.unlocked = true;
      render();
    } else {
      showToast('Incorrect cluster manager passcode.');
    }
  };
  const clusterLockBtn = document.getElementById('clusterLockBtn');
  if(clusterLockBtn) clusterLockBtn.onclick = ()=>{ clusterAuth.unlocked = false; render(); };
  const adminClusterSwitch = document.getElementById('adminClusterSwitch');
  if(adminClusterSwitch) adminClusterSwitch.onchange = ()=>{ clusterAuth.clusterManager = adminClusterSwitch.value; render(); };

  // Regional login gate
  const loginRegionalSelect = document.getElementById('loginRegionalSelect');
  if(loginRegionalSelect) loginRegionalSelect.onchange = (e)=>{ regionalAuth.region = e.target.value; render(); };
  const regionalUnlockBtn = document.getElementById('regionalUnlockBtn');
  if(regionalUnlockBtn) regionalUnlockBtn.onclick = async ()=>{
    const sel = document.getElementById('loginRegionalSelect');
    const pass = document.getElementById('loginRegionalPass').value;
    regionalUnlockBtn.disabled = true; regionalUnlockBtn.textContent = 'Checking...';
    const ok = await verifyLogin('regional', sel.value, pass);
    regionalUnlockBtn.disabled = false; regionalUnlockBtn.textContent = 'Unlock';
    if(ok){
      regionalAuth.region = sel.value;
      regionalAuth.unlocked = true;
      ctx.region = sel.value;
      render();
    } else {
      showToast('Incorrect regional manager passcode.');
    }
  };
  const regionalLockBtn = document.getElementById('regionalLockBtn');
  if(regionalLockBtn) regionalLockBtn.onclick = ()=>{ regionalAuth.unlocked = false; render(); };

  // Admin entry (small link in header, not part of main tabs)
  const adminEntryLink = document.getElementById('adminEntryLink');
  if(adminEntryLink) adminEntryLink.onclick = ()=>{ screen='admin'; render(); };
  const manualRefreshBtn = document.getElementById('manualRefreshBtn');
  if(manualRefreshBtn) manualRefreshBtn.onclick = async ()=>{
    manualRefreshBtn.disabled = true; manualRefreshBtn.textContent = 'Refreshing...';
    const fresh = await fetchDataFromBackend();
    manualRefreshBtn.disabled = false; manualRefreshBtn.textContent = '↻ Refresh';
    if(fresh){
      DATA = fresh;
      lastLoadedTs = new Date().toISOString();
      nextRefreshIn = REFRESH_INTERVAL_SECONDS; // manual refresh also resets the auto-refresh countdown
      render();
      showToast('Refreshed.');
    } else {
      showToast('Refresh failed — still showing the last successfully loaded data.', 6000);
    }
  };

  const adminUnlockBtn = document.getElementById('adminUnlockBtn');
  if(adminUnlockBtn) adminUnlockBtn.onclick = async ()=>{
    const u = document.getElementById('loginAdminUser').value.trim();
    const p = document.getElementById('loginAdminPass').value;
    adminUnlockBtn.disabled = true; adminUnlockBtn.textContent = 'Checking...';
    const ok = await verifyLogin('admin', u, p);
    adminUnlockBtn.disabled = false; adminUnlockBtn.textContent = 'Unlock';
    if(ok){
      adminAuth.unlocked = true;
      adminSubView = 'upload';
      render();
    }else{
      showToast('Incorrect admin username or password.');

  const adminLockBtn = document.getElementById('adminLockBtn');
  if(adminLockBtn) adminLockBtn.onclick = ()=>{ adminAuth.unlocked=false; screen='hq'; render(); };

  const adminTabUpload = document.getElementById('adminTabUpload');
  if(adminTabUpload) adminTabUpload.onclick = ()=>{ adminSubView='upload'; render(); };
  const adminTabAudit = document.getElementById('adminTabAudit');
  if(adminTabAudit) adminTabAudit.onclick = ()=>{ adminSubView='audit'; render(); };

  const testBtn = document.getElementById('testConnBtn');
  if(testBtn) testBtn.onclick = ()=>showToast('No backend configured — this prototype runs entirely on local persistent storage, not a live Apps Script endpoint.', 4500);
  const uploadBtn = document.getElementById('uploadBtn');
  if(uploadBtn) uploadBtn.onclick = handleUpload;
}

function persistQuiet(){ saveData(DATA); }

// Re-syncs the Submit button's disabled state / label directly in the DOM
// (no render()) so it reacts instantly to checkbox changes without touching
// any remarks textarea a manager may still be typing into.
function updateSubmitButtonState(){
  const container = document.getElementById('submitControls');
  if(!container) return;
  const store = storeByCode(storeAuth.storeCode);
  const mine = txnsFor(t=>t.storeCode===store.code);
  const approvedDraftCount = mine.filter(t=>t.status==='Not Submitted' && t.storeApproval).length;
  container.innerHTML = renderSubmitControlsInner(approvedDraftCount);
  const btn = document.getElementById('submitAllBtn');
  if(btn) btn.onclick = ()=>{ if(!btn.disabled) submitStoreDrafts(storeAuth.storeCode); };
}

// Only transactions ticked "Is Approved by Manager" move forward — an
// unapproved draft stays at the store for further action instead of being
// silently pushed into Cluster Review.
function submitStoreDrafts(storeCode){
  const drafts = DATA.transactions.filter(t=>t.storeCode===storeCode && t.status==='Not Submitted' && t.storeApproval);
  if(!drafts.length){ showToast('No approved draft transactions to submit.'); return; }
  const missingReason = drafts.filter(t=>!t.reason || (t.reason==='Other' && !t.reasonRemarks.trim()));
  if(missingReason.length){
    showToast(`${missingReason.length} approved transaction(s) are missing a Reason for Return (or remarks for "Other") — select one before submitting.`, 6000);
    return;
  }
  const today = new Date().toISOString();
  drafts.forEach(t=>{
    t.status='Awaiting Review';
    t.submittedDate = t.date;
    t.lastUpdated = today;
    t.lastUpdatedBy = 'Store Manager';
    addAudit({user:'Store Manager', role:'Store', action:'Store Submitted', transaction:t.transactionNumber, prevStatus:'Not Submitted', newStatus:'Awaiting Review', remarks:t.storeRemarks});
  });
  saveData(DATA);
  showToast(`${drafts.length} approved transaction(s) submitted and locked for Cluster Review.`);
  render();
}

function resubmitTxn(id){
  const t = DATA.transactions.find(x=>x.id===id);
  if(!t || t.status!=='Re-Review') return;
  t.status='Awaiting Review';
  t.lastUpdated=new Date().toISOString();
  t.lastUpdatedBy='Store Manager';
  addAudit({user:'Store Manager', role:'Store', action:'Store Resubmitted', transaction:t.transactionNumber, prevStatus:'Re-Review', newStatus:'Awaiting Review', remarks:t.storeRemarks});
  saveData(DATA);
  showToast('Transaction resubmitted and locked again.');
  render();
}

function signOffTxn(id){
  const t = DATA.transactions.find(x=>x.id===id);
  if(!t) return;
  const prev = t.status;
  t.reviewHistory = t.reviewHistory || [];
  t.reviewHistory.push({ round: t.reviewHistory.length+1, decision:'Signed Off', remarks:t.clusterRemarks, by:clusterAuth.clusterManager, date:new Date().toISOString() });
  t.status='Signed Off';
  t.reviewedDate = new Date().toISOString().slice(0,10);
  t.lastUpdated = new Date().toISOString();
  t.lastUpdatedBy = clusterAuth.clusterManager;
  addAudit({user:clusterAuth.clusterManager, role:'Cluster Manager', action:'Cluster Manager Signed Off (round '+t.reviewHistory.length+')', transaction:t.transactionNumber, prevStatus:prev, newStatus:'Signed Off', remarks:t.clusterRemarks});
  saveData(DATA);
  showToast('Transaction signed off and closed.');
  render();
}

function sendReReview(id){
  const t = DATA.transactions.find(x=>x.id===id);
  if(!t) return;
  if(!t.clusterRemarks || !t.clusterRemarks.trim()){
    showToast('Cluster Manager remarks are required before sending for re-review.', 4000);
    return;
  }
  const prev = t.status;
  t.reviewHistory = t.reviewHistory || [];
  t.reviewHistory.push({ round: t.reviewHistory.length+1, decision:'Re-Review', remarks:t.clusterRemarks, by:clusterAuth.clusterManager, date:new Date().toISOString() });
  t.status='Re-Review';
  t.lastUpdated = new Date().toISOString();
  t.lastUpdatedBy = clusterAuth.clusterManager;
  addAudit({user:clusterAuth.clusterManager, role:'Cluster Manager', action:'Cluster Manager Sent for Re-Review (round '+t.reviewHistory.length+')', transaction:t.transactionNumber, prevStatus:prev, newStatus:'Re-Review', remarks:t.clusterRemarks});
  saveData(DATA);
  showToast('Sent back to store for re-review.');
  render();
}

// Cluster Review / Cluster Manager Review 2 cell — round 1 is "Cluster Review",
// round 2 (only present if round 1 was Re-Review and store resubmitted) is
// "Cluster Manager Review 2".
function reviewRoundCell(t, round){
  const entry = (t.reviewHistory||[])[round-1];
  if(!entry) return '<span class="locked-note">—</span>';
  const cls = entry.decision==='Signed Off' ? 'st-signed' : 'st-rereview';
  return `<span class="badge ${cls}">${esc(entry.decision)}</span>
    <div class="remark-locked" style="margin-top:5px;">${esc(entry.remarks)||'—'}</div>
    <div class="locked-note" style="margin-top:3px;">${esc(entry.by||'')} · ${entry.date?fmtDateTime(entry.date):''}</div>`;
}

/* =========================================================
   UPLOAD / IMPORT — real Return Report format
   ---------------------------------------------------------
   This parses the row-level Return/Exchange/Refund export directly
   (one row per line-item, heavy per-transaction duplication),
   collapses rows to distinct transactions, and classifies each into
   Over 30 Days / Refund / Full Price Sale Return using the same base
   logic as the retail-returns-compliance skill's analyze_returns.py
   (Credit Memo is no longer tracked as its own bucket — a transaction
   settled via credit memo now falls under Full Price Sale Return if
   any line was returned at full price, otherwise it is skipped as a
   clean exchange, same as any other non-flagged return).

   COLUMN LAYOUT: this matches the skill's documented column
   contract (SKILL.md / analyze_returns.py COL_* constants) — no
   "Time" column. An earlier version of this file carried a +1
   offset from RETURN_RECEIPT onward to match a report export that
   had a stray Time column after Return Date; that column has since
   been removed from the source report, so the offset is removed
   here too. If a future export reintroduces a Time (or any other)
   column, EXPECTED_HEADERS below will catch it — the strict column
   check aborts the import with a clear mismatch message rather than
   silently misaligning data.

   Only Refund, Over 30 Days and Full Price Sale Return transactions
   are imported. A clean, on-time, discounted exchange is not a
   compliance item and is intentionally skipped — the upload summary
   reports how many were skipped this way so nothing silently
   disappears.
   ========================================================= */
const SRC_HEADER_ROW_1BASED = 7; // documented header row; verified by content, not just position
const EXPECTED_HEADERS = [
  'Store Name','Store','Date','Receipt','Sales Order','Transaction','Sales Group','Sales Group Name',
  'Receipt','Transaction','Sales Order','Date','Store','Store Name','Phone Number',
  'Item','Barcode','Quantity','Unit Price','Total Amount',
  'Item','Barcode','Price','Quantity','Total Amount',
  'Transaction Type','Payment Method Name'
];
const COL = {
  STORE_NAME:0, STORE_CODE:1, RETURN_DATE:2, RETURN_RECEIPT:3, SALES_ORDER:4, TRANSACTION:5,
  SALES_GROUP:6, SALES_GROUP_NAME:7, ORIG_RECEIPT:8, ORIG_TRANSACTION:9, ORIG_SALES_ORDER:10, ORIG_DATE:11,
  ORIG_STORE:12, ORIG_STORE_NAME:13, PHONE:14, SOLD_ITEM:15, SOLD_BARCODE:16, SOLD_QTY:17, SOLD_UNIT_PRICE:18,
  SOLD_TOTAL:19, RETURN_ITEM:20, RETURN_BARCODE:21, RETURN_PRICE:22, RETURN_QTY:23, RETURN_TOTAL:24,
  TXN_TYPE:25, PAYMENT_METHOD:26,
  TRANSACTION_TIME:27, // column AB — new. Read positionally, not header-name
                       // checked, since the exact label you give it in the
                       // report isn't fixed yet; whatever's in AB is used.
};

function normText(v){ return String(v==null?'':v).trim().toLowerCase(); }
function numOf(v){ const n = Number(v); return isNaN(n) ? 0 : n; }
function toDateOnly(v){
  if(v instanceof Date && !isNaN(v.getTime())) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if(typeof v === 'string' && v.trim()){
    const d = new Date(v);
    if(!isNaN(d.getTime())) return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }
  return null;
}
// Transaction Time (column AB) can arrive as a JS Date (Excel serial with
// cellDates:true), a raw Excel time fraction (0–1 = fraction of a day), or
// plain text like "14:35". All three are normalized to "HH:MM".
function toTimeString(v){
  if(v instanceof Date && !isNaN(v.getTime())){
    return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');
  }
  if(typeof v === 'number' && v>=0 && v<1){
    const totalMin = Math.round(v*24*60);
    return String(Math.floor(totalMin/60)).padStart(2,'0')+':'+String(totalMin%60).padStart(2,'0');
  }
  if(typeof v === 'string' && v.trim()) return v.trim();
  return '';
}
function isoDate(d){ return d ? d.toISOString().slice(0,10) : null; }

// Find the header row by content (search near the documented row first,
// then scan) rather than trusting the row number alone.
function findHeaderRowIndex(aoa){
  const candidates = [SRC_HEADER_ROW_1BASED-1, ...Array.from({length:15},(_,i)=>i)];
  for(const idx of candidates){
    const row = aoa[idx];
    if(!row) continue;
    const norm = row.map(normText);
    if(norm.includes('transaction type') && norm.includes('payment method name')) return idx;
  }
  return -1;
}

function handleUpload(){
  const input = document.getElementById('fileInput');
  const file = input.files[0];
  if(!file){ showToast('Choose a file first.'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const sheetName = wb.SheetNames.find(n=>!/attribut/i.test(n)) || wb.SheetNames[0];
      const sheet = wb.Sheets[sheetName];
      const aoa = XLSX.utils.sheet_to_json(sheet, {header:1, defval:'', raw:true});
      if(!aoa.length){ showToast('File has no rows.'); return; }

      const headerIdx = findHeaderRowIndex(aoa);
      if(headerIdx===-1){
        showToast(`Could not find the report header row (expected "Transaction Type" and "Payment Method Name" columns). Import aborted — this file doesn't look like a Return Report export.`, 6000);
        return;
      }
      const actualHeaders = aoa[headerIdx].map(h=>String(h||'').trim());
      const mismatches = EXPECTED_HEADERS.map((exp,i)=>({i, exp, got:actualHeaders[i]||''}))
        .filter(m=>normText(m.exp)!==normText(m.got));
      if(mismatches.length){
        const detail = mismatches.slice(0,6).map(m=>`col ${m.i+1}: expected "${m.exp}", found "${m.got||'(blank)'}"`).join(' · ');
        showToast(`Report column layout doesn't match what this dashboard expects — import aborted rather than risk wrong numbers. ${detail}`, 9000);
        document.getElementById('uploadSummaryBox').innerHTML = `<div class="warn-box" style="margin-top:12px;"><b>Column mismatch — nothing imported.</b><br>${detail}${mismatches.length>6?` · +${mismatches.length-6} more`:''}<br>Check the file layout against the Recognized Format note above before re-uploading.</div>`;
        return;
      }

      const dataRows = aoa.slice(headerIdx+1).filter(r=>r.some(c=>String(c||'').trim()!==''));
      if(!dataRows.length){ showToast('Header row found but no data rows beneath it.'); return; }

      // Group raw rows into distinct transactions.
      const PRICE_MATCH_TOLERANCE = 0.5; // rupees — absorbs rounding, not real discounts
      const groups = new Map();
      let skippedNoKey = 0;
      dataRows.forEach(row=>{
        const key = String(row[COL.TRANSACTION]||'').trim();
        if(!key){ skippedNoKey++; return; }
        if(!groups.has(key)){
          groups.set(key, {
            key,
            storeCode: String(row[COL.STORE_CODE]||'').trim(),
            returnDate: toDateOnly(row[COL.RETURN_DATE]),
            txnTime: toTimeString(row[COL.TRANSACTION_TIME]),
            origTransaction: '', origDate: null, paymentMethod: '', txnType: '',
            returnQty: 0, returnTotal: 0, soldTotal: 0, itemCount: 0,
            fullPriceItemCount: 0, discountedItemCount: 0, discountValue: 0,
            fullPriceValue: 0, barcodes: [],
          });
        }
        const g = groups.get(key);
        g.returnQty += numOf(row[COL.RETURN_QTY]);
        g.returnTotal += numOf(row[COL.RETURN_TOTAL]);
        g.soldTotal += numOf(row[COL.SOLD_TOTAL]);
        if(String(row[COL.RETURN_BARCODE]||'').trim()){
          g.itemCount++;
          // Full-price check for this line item: Return Price (listed unit
          // price on the return line) x Return Qty is the value the item
          // would carry at full price. Compare against the line's actual
          // Return Total Amount — if they match, the item was returned at
          // full price; if not, the sale (and so the return) was on discount.
          const rowQty = numOf(row[COL.RETURN_QTY]);
          const rowPrice = numOf(row[COL.RETURN_PRICE]);
          const rowActual = numOf(row[COL.RETURN_TOTAL]);
          const rowFullPriceValue = rowPrice * rowQty;
          const isFullPriceLine = Math.abs(rowFullPriceValue - rowActual) <= PRICE_MATCH_TOLERANCE;
          if(isFullPriceLine){
            g.fullPriceItemCount++;
            g.fullPriceValue += rowActual;
          } else {
            g.discountedItemCount++;
            g.discountValue += (rowFullPriceValue - rowActual);
          }
          const rowBarcode = String(row[COL.RETURN_BARCODE]).trim();
          const existingBarcode = g.barcodes.find(b=>b.barcode===rowBarcode);
          if(existingBarcode){ existingBarcode.qty += rowQty; existingBarcode.amount += rowActual; }
          else { g.barcodes.push({ barcode: rowBarcode, qty: rowQty, amount: rowActual, fullPrice: isFullPriceLine }); }
        }
        if(!g.origTransaction && row[COL.ORIG_TRANSACTION]) g.origTransaction = String(row[COL.ORIG_TRANSACTION]).trim();
        if(!g.origDate && row[COL.ORIG_DATE]){ const d=toDateOnly(row[COL.ORIG_DATE]); if(d) g.origDate=d; }
        if(!g.paymentMethod && row[COL.PAYMENT_METHOD]) g.paymentMethod = String(row[COL.PAYMENT_METHOD]).trim();
        if(!g.txnType && row[COL.TXN_TYPE]) g.txnType = String(row[COL.TXN_TYPE]).trim();
      });

      let imported=0, duplicate=0, unknownStore=0, notFlagged=0, missingReturnDate=0;
      const existingKeys = new Set(DATA.transactions.map(t=>t.transactionNumber));
      let nextId = DATA.transactions.length + 1;

      groups.forEach(g=>{
        if(existingKeys.has(g.key)){ duplicate++; return; }
        const store = resolveStore(g.storeCode);
        if(!store){ unknownStore++; return; }

        const isOnlineCN = /^cn/i.test(g.origTransaction||'');
        let agingDays = null, isOver30 = false;
        if(g.origDate && !isOnlineCN && g.returnDate){
          agingDays = Math.round((g.returnDate - g.origDate) / 86400000);
          isOver30 = agingDays > 30;
        }
        // Credit Memo is no longer its own compliance bucket, but the
        // settlement-method check is kept as a guard so a transaction settled
        // via Credit Memo is never mis-typed as a cash/bank Refund purely
        // because of a remaining-balance mismatch.
        const isCreditMemo = normText(g.paymentMethod) === 'credit memo';
        const remainingBalance = g.returnTotal - Math.abs(g.soldTotal);
        const isRefund = !isCreditMemo && (normText(g.txnType)==='refund' || remainingBalance>0);
        // Credit Memo settlements are explicitly excluded from the Full Price
        // Sale Return table — a credit-note issuance is not the same
        // compliance event as a full-price cash/exchange return, and mixing
        // them was flagged as a reporting error.
        const isFullPriceReturn = g.fullPriceItemCount > 0 && !isCreditMemo;

        let category = null;
        if(isOver30) category = 'over30';
        else if(isRefund) category = 'refund';
        else if(isFullPriceReturn) category = 'fullprice';
        if(!category){ notFlagged++; return; }

        existingKeys.add(g.key);
        // Compliance "amount" is metric-specific, matching the skill's Store
        // Summary: Over 30 Days reports raw Return Value (the full amount at
        // risk from a late return). Refund reports Remaining Balance (Return
        // Value - Sold Value) — the money actually leaked to the customer.
        // Full Price Sale Return reports the value of the full-price line(s)
        // actually returned — the "Transactions Value" for that KPI.
        const complianceAmount = category === 'over30' ? g.returnTotal
          : category === 'refund' ? remainingBalance
          : g.fullPriceValue;
        let priceType = 'N/A';
        if(g.fullPriceItemCount>0 && g.discountedItemCount===0) priceType = 'Full Price';
        else if(g.discountedItemCount>0 && g.fullPriceItemCount===0) priceType = 'Discounted';
        else if(g.fullPriceItemCount>0 && g.discountedItemCount>0) priceType = 'Mixed';
        // The report's own Return Date column decides which day a transaction
        // is filed under everywhere in this dashboard — NOT the date it was
        // uploaded/imported. If that column can't be parsed for a given
        // transaction, it is rejected rather than silently defaulted to
        // today's date, since a silent default would misfile it under the
        // wrong day in every date-range filter.
        if(!g.returnDate){ missingReturnDate++; return; }
        DATA.transactions.push(baseTxn({
          id: 'T'+String(nextId++).padStart(5,'0'),
          category,
          storeCode: store.code,
          transactionNumber: g.key,
          itemCount: g.itemCount,
          qty: g.returnQty,
          amount: complianceAmount,
          paymentMethod: g.paymentMethod,
          date: isoDate(g.returnDate),
          time: g.txnTime || '',
          agingDays,
          priceType,
          discountValue: g.discountValue,
          barcodes: g.barcodes,
          origTransaction: g.origTransaction,
          status: 'Not Submitted',
        }));
        imported++;
      });

      const logEntry = {
        timestamp:new Date().toISOString(), fileName:file.name,
        total: groups.size, imported, duplicate,
        rejected: unknownStore + notFlagged + missingReturnDate,
        status: imported>0?'Processed':'No records imported'
      };
      DATA.uploadLog.unshift(logEntry);
      DATA.lastUploadTs = logEntry.timestamp;
      addAudit({user:'Admin', role:'Admin', action:`Admin Uploaded Return Report (${file.name})`, transaction:'—', prevStatus:'—', newStatus:'—', remarks:`${imported} imported, ${duplicate} duplicate, ${unknownStore} unknown store, ${notFlagged} not flagged (clean exchange), ${missingReturnDate} unparseable return date, ${skippedNoKey} rows with no Transaction key`});
      saveData(DATA);

      document.getElementById('uploadSummaryBox').innerHTML = `
        <div class="note-box" style="margin-top:12px;">
          <b>Upload Summary</b> — Distinct transactions: ${groups.size} · Imported: ${imported} · Duplicate (already in system): ${duplicate} · Unknown store code: ${unknownStore} · Not flagged / clean exchange (skipped, not a compliance item): ${notFlagged}${missingReturnDate?` · <b>Unparseable Return Date (skipped — fix and re-upload): ${missingReturnDate}</b>`:''}${skippedNoKey?` · Rows with no Transaction key: ${skippedNoKey}`:''}
        </div>`;
      showToast(`Import complete: ${imported} new transaction(s) added.`);
      render();
    }catch(err){
      showToast('Could not read file: '+(err.message||err), 5000);
    }
  };
  reader.readAsArrayBuffer(file);
}

function resolveStore(raw){
  const s = String(raw||'').trim().toLowerCase();
  if(!s) return null;
  return STORES.find(st=>st.code.toLowerCase()===s || st.name.toLowerCase()===s) || null;
}

/* =========================================================
   AUTO REFRESH (safe: skips while a field is being edited)
   ========================================================= */
setInterval(async ()=>{
  nextRefreshIn--;
  if(nextRefreshIn<=0){
    nextRefreshIn=REFRESH_INTERVAL_SECONDS;
    if(!editingActive){
      // A failed refresh keeps showing the last successfully loaded DATA
      // instead of wiping the screen — a transient network blip must never
      // look like the data was deleted.
      const fresh = await fetchDataFromBackend();
      if(fresh){
        DATA = fresh;
        lastLoadedTs = new Date().toISOString();
        render();
      } else {
        showToast('Auto-refresh failed — still showing the last successfully loaded data.', 6000);
      }
      return;
    }
  }
  renderClock();
}, 1000);

/* =========================================================
   INIT
   ========================================================= */
(async function init(){
  DATA = await loadData();
  lastLoadedTs = new Date().toISOString();
  render();
})();
</script>
